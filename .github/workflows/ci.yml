# GAP E-01 / NFR-30, NFR-51, NFR-52 — the checks the roadmap promised, run on every push.
#
# One job, in the order a developer would run them: style and static analysis first because
# they are cheap and fail fast; the front-end tests and build next because the Pest suite reads
# the Vite manifest; then the full Pest suite against a real MySQL 8, never SQLite, because the
# invariants it proves (CHECK constraints, generated columns, views) do not exist on SQLite
# (phpunit.xml). Dependency audits run last so a vulnerable package fails the build without
# hiding a test failure behind it.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pint · PHPStan · Vitest · Build · Pest · Audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: octa_erp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: octa_erp_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip
          coverage: none

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist --optimize-autoloader

      - name: Application key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: npm dependencies
        run: npm ci --ignore-scripts

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

      - name: Pest
        run: php artisan test --compact

      - name: composer audit
        run: composer audit --no-interaction

      - name: npm audit
        run: npm audit --audit-level=high
