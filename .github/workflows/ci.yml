name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        # 8.0.16+ is the floor: earlier releases parse CHECK constraints and ignore them,
        # which would turn every invariant in the suite into a comment.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: octa_erp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=10

      redis:
        image: redis:7
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis, bcmath, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci

      - name: Style
        run: ./vendor/bin/pint --test

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Schema loads clean
        # Proves every foreign key target exists and matches in signedness, every check
        # constraint parses, every generated column is deterministic and every view resolves.
        run: |
          mysql -h 127.0.0.1 -uroot -ppassword -e "DROP DATABASE IF EXISTS erpspec;
            CREATE DATABASE erpspec CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          mysql -h 127.0.0.1 -uroot -ppassword erpspec < docs/02a-schema.sql

      - name: Tests
        run: ./vendor/bin/pest --colors=always
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Build assets
        run: npm run build
